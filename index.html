<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UP Khasra / Gata Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 2; width: 320px;
    background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    padding: 12px; font-size: 14px;
  }
  #panel h1 { font-size: 16px; margin: 0 0 8px; }
  #panel input { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0; }
  #panel button { padding: 6px 10px; margin-top: 4px; cursor: pointer; }
  #result { margin-top: 10px; max-height: 40vh; overflow: auto; }
  #result table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #result td { border-top: 1px solid #eee; padding: 3px 4px; vertical-align: top; word-break: break-word; }
  .khasra { font-size: 22px; font-weight: 700; color: #b00020; }
  #status { font-size: 12px; color: #555; margin-top: 8px; }
  .muted { color: #777; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>UP Khasra / Gata Finder</h1>
  <div class="muted">Click a parcel on the map, or enter coordinates:</div>
  <input id="coords" placeholder="lat, lon  e.g. 26.8467, 80.9462" />
  <button id="go">Find Khasra</button>
  <div id="result"></div>
  <div id="status">Loading…</div>
</div>

<script type="module">
import Pbf from 'https://esm.sh/pbf@3.2.1';
import { VectorTile } from 'https://esm.sh/@mapbox/vector-tile@1.3.1';

// ---- Config ----
const TILE_URL = 'https://indianopenmaps.com/not-so-open/cadastrals/uttar-pradesh/ncog/{z}/{x}/{y}.pbf';
const UP_BOUNDS = [[77.0, 23.8], [84.7, 30.5]];
const TILE_MAXZOOM = 15;          // server's max zoom guess; MapLibre overzooms beyond this
const PROBE_ZOOM = 14;
// Places used to sniff a tile for layer/field names (several, as coverage is partial)
const PROBE_POINTS = [
  [80.9462, 26.8467], [82.9739, 25.3176], [78.0081, 27.1767], [81.8463, 25.4358],
  [77.7064, 29.4727], [83.3732, 26.7606], [79.4304, 28.3670], [80.3319, 26.4499],
];
// Field names that likely hold the Khasra / Gata number (first match wins)
const KHASRA_RE = /khasra|khsra|gata|kide|plot|survey|kh_?no|parcel|gat_?no/i;

const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const setStatus = (t) => statusEl.textContent = t;

function lonLatToTile(lon, lat, z) {
  const n = 2 ** z;
  const x = Math.floor((lon + 180) / 360 * n);
  const r = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
  return { x, y };
}

// Download sample tiles until one has features; return layer names + property keys
async function discoverSchema() {
  for (const [lon, lat] of PROBE_POINTS) {
    const { x, y } = lonLatToTile(lon, lat, PROBE_ZOOM);
    const url = TILE_URL.replace('{z}', PROBE_ZOOM).replace('{x}', x).replace('{y}', y);
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const buf = await res.arrayBuffer();
      if (!buf.byteLength) continue;
      const vt = new VectorTile(new Pbf(new Uint8Array(buf)));
      const layers = Object.keys(vt.layers);
      for (const name of layers) {
        const layer = vt.layers[name];
        if (!layer.length) continue;
        const keys = new Set();
        for (let i = 0; i < Math.min(layer.length, 20); i++) {
          Object.keys(layer.feature(i).properties).forEach(k => keys.add(k));
        }
        return { layers, layer: name, keys: [...keys], sample: layer.feature(0).properties };
      }
    } catch (e) {
      console.warn('Probe failed', url, e);
      if (e instanceof TypeError) throw new Error('Tile request blocked (likely CORS / network). See console.');
    }
  }
  throw new Error('No features found in sample tiles.');
}

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256,
             maxzoom: 19, attribution: '© OpenStreetMap contributors' },
      sat: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
             tileSize: 256, maxzoom: 19, attribution: 'Imagery © Esri' },
    },
    layers: [
      { id: 'osm', type: 'raster', source: 'osm' },
      { id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } },
    ],
  },
  bounds: UP_BOUNDS,
  maxZoom: 20,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

// simple basemap toggle
class BaseToggle {
  onAdd(m) {
    const b = document.createElement('button');
    b.textContent = 'Satellite'; b.className = 'maplibregl-ctrl maplibregl-ctrl-group';
    b.style.cssText = 'padding:4px 8px;cursor:pointer;';
    b.onclick = () => {
      const sat = m.getLayoutProperty('sat', 'visibility') === 'visible';
      m.setLayoutProperty('sat', 'visibility', sat ? 'none' : 'visible');
      b.textContent = sat ? 'Satellite' : 'Street';
    };
    return b;
  }
  onRemove() {}
}
map.addControl(new BaseToggle(), 'top-right');

let khasraKey = null;
let marker = null;

function showFeature(f, lngLat) {
  if (!f) {
    resultEl.innerHTML = `<div>No parcel found at ${lngLat.lat.toFixed(6)}, ${lngLat.lng.toFixed(6)}.</div>
      <div class="muted">This area may not be covered (dataset is partial), or tiles haven't loaded yet.</div>`;
    return;
  }
  const p = f.properties;
  const kh = khasraKey ? p[khasraKey] : null;
  const rows = Object.entries(p).map(([k, v]) => `<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join('');
  resultEl.innerHTML = `
    <div class="muted">${lngLat.lat.toFixed(6)}, ${lngLat.lng.toFixed(6)}</div>
    ${kh != null ? `<div>Khasra / Gata: <span class="khasra">${kh}</span></div>` : ''}
    <table>${rows}</table>`;
  map.getSource('selected').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: f.geometry, properties: {} }] });
}

function lookupAt(lngLat) {
  if (marker) marker.remove();
  marker = new maplibregl.Marker({ color: '#b00020' }).setLngLat(lngLat).addTo(map);
  const pt = map.project(lngLat);
  const feats = map.queryRenderedFeatures(pt, { layers: ['parcel-fill'] });
  showFeature(feats[0], maplibregl.LngLat.convert(lngLat));
}

map.on('load', async () => {
  setStatus('Inspecting cadastral tiles…');
  let schema;
  try {
    schema = await discoverSchema();
  } catch (e) {
    setStatus('⚠ ' + e.message);
    return;
  }
  khasraKey = schema.keys.find(k => KHASRA_RE.test(k)) || null;
  console.log('Tile schema:', schema);
  setStatus(`Layer: "${schema.layer}" · fields: ${schema.keys.join(', ')} · khasra field: ${khasraKey || '(not detected)'}`);

  map.addSource('cad', { type: 'vector', tiles: [TILE_URL], maxzoom: TILE_MAXZOOM,
                         attribution: 'Cadastrals: indianopenmaps / NCOG' });
  map.addLayer({ id: 'parcel-fill', type: 'fill', source: 'cad', 'source-layer': schema.layer,
                 paint: { 'fill-color': '#ffcc00', 'fill-opacity': 0.08 } });
  map.addLayer({ id: 'parcel-line', type: 'line', source: 'cad', 'source-layer': schema.layer,
                 paint: { 'line-color': '#e65100', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 0.3, 18, 1.5] } });
  if (khasraKey) {
    map.addLayer({ id: 'parcel-label', type: 'symbol', source: 'cad', 'source-layer': schema.layer, minzoom: 16,
                   layout: { 'text-field': ['to-string', ['get', khasraKey]], 'text-font': ['Open Sans Regular'],
                             'text-size': 11 },
                   paint: { 'text-color': '#222', 'text-halo-color': '#fff', 'text-halo-width': 1.2 } });
  }
  map.addSource('selected', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'selected-line', type: 'line', source: 'selected', paint: { 'line-color': '#b00020', 'line-width': 3 } });

  map.on('click', (e) => lookupAt(e.lngLat));
  map.on('mouseenter', 'parcel-fill', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'parcel-fill', () => map.getCanvas().style.cursor = '');
});

document.getElementById('go').onclick = () => {
  const m = document.getElementById('coords').value.split(/[ ,]+/).filter(Boolean).map(Number);
  if (m.length !== 2 || m.some(isNaN)) { alert('Enter as: lat, lon'); return; }
  let [lat, lon] = m;
  if (lat > 60 && lon < 40) [lat, lon] = [lon, lat]; // tolerate lon,lat order
  const lngLat = { lng: lon, lat };
  resultEl.innerHTML = 'Searching…';
  map.flyTo({ center: [lon, lat], zoom: 17 });
  map.once('idle', () => lookupAt(lngLat));
};
document.getElementById('coords').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
</script>
</body>
</html>
